<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出荷集計アプリ</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-shell">
        <header class="page-header">
            <p class="eyebrow">SHIPMENT PLANNER</p>
            <h1>出荷集計アプリ</h1>
            <p>規格別の数量を集計し、パレットへの積み分けを確認します。</p>
        </header>

        <form id="shipmentForm" class="shipment-form">
            <section class="panel details-panel">
                <div class="section-heading">
                    <div>
                        <p class="section-label">01 / 基本情報</p>
                        <h2>出荷情報</h2>
                    </div>
                    <span class="required-note">* 必須</span>
                </div>
                <div class="details-grid">
                    <div class="input-group">
                        <label for="shipmentDate">出荷日 <span>*</span></label>
                        <input type="date" id="shipmentDate" required>
                    </div>
                    <div class="input-group">
                        <label for="varietyName">品種名 <span>*</span></label>
                        <input type="text" id="varietyName" placeholder="例: 品種A" required>
                    </div>
                </div>
            </section>

            <section class="panel standards-panel">
                <div class="section-heading">
                    <div>
                        <p class="section-label">02 / 数量入力</p>
                        <h2>規格別数量</h2>
                    </div>
                    <span class="unit-note">単位: 箱</span>
                </div>
                <div id="standardsGrid" class="standards-grid"></div>
            </section>

            <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>
            <button type="submit" class="btn-primary">数量を集計する</button>
        </form>

        <section id="results" class="results" aria-live="polite" hidden>
            <div class="results-heading">
                <div>
                    <p class="section-label">03 / 集計結果</p>
                    <h2 id="resultTitle">出荷集計</h2>
                </div>
                <p id="resultDate" class="result-date"></p>
            </div>
            <div id="summaryCards" class="summary-cards"></div>
            <section id="palletSettings" class="pallet-settings" hidden>
                <div>
                    <p class="section-label">04 / パレット設定</p>
                    <h3>合計を確認して、パレット枚数を選択</h3>
                </div>
                <div class="pallet-settings-controls">
                    <label for="palletCount">パレット枚数</label>
                    <select id="palletCount">
                        <option value="">選択してください</option>
                        <option value="1">1枚</option>
                        <option value="2">2枚</option>
                        <option value="3">3枚</option>
                        <option value="4">4枚</option>
                        <option value="5">5枚</option>
                    </select>
                    <button type="button" id="calculatePlanButton" class="btn-secondary">積み分けを計算</button>
                </div>
                <p id="palletMessage" class="form-message" role="alert" aria-live="polite"></p>
            </section>
            <div class="result-columns">
                <section class="result-block">
                    <div class="block-heading">
                        <h3>パレット積み分け</h3>
                        <span id="planStatus" class="status-badge"></span>
                    </div>
                    <div id="palletPlan" class="pallet-plan"></div>
                </section>
                <section class="result-block input-breakdown-block">
                    <div class="block-heading">
                        <h3>入力数量の内訳</h3>
                    </div>
                    <div id="inputBreakdown" class="breakdown-list"></div>
                </section>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
