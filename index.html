<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>足し算アプリ</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="calculator">
        <h1>足し算アプリ</h1>

        <form id="sumForm" class="calculator-form">
            <div class="input-group">
                <label for="number1">1つ目の値</label>
                <input type="number" id="number1" step="any" placeholder="例: 12" aria-label="1つ目の値">
            </div>

            <div class="input-group">
                <label for="number2">2つ目の値</label>
                <input type="number" id="number2" step="any" placeholder="例: 8" aria-label="2つ目の値">
            </div>

            <button type="submit" class="btn-primary">足し算する</button>
        </form>

        <p id="result" aria-live="polite">結果: 0</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
